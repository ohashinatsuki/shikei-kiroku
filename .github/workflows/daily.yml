name: 毎日の記録更新

on:
  schedule:
    # 18:00 UTC = 日本時間 午前3時
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "世界の巡回でさかのぼる日数"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 必要なライブラリを入れる
        run: pip install -r scripts/requirements.txt

      - name: 新しい執行を調べて追記する
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/update.py ${{ github.event.inputs.days || '10' }}

      - name: 変更があれば公開する
        run: |
          git config user.name "shikei-kiroku bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json state/seen.json; then
            echo "変更なし。今日は新しく確認できた執行がありませんでした。"
          else
            git add data.json state/seen.json
            git commit -m "自動更新: $(date -u -d '+9 hours' '+%Y-%m-%d') 時点の記録"
            git push
          fi
